spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: booking-service
              uri: lb://booking-service
              predicates:
                - Path=/api/rooms/**,/api/bookings/**
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/payments/**
    openfeign:
      circuitbreaker:
        enabled: true
server:
  port: 8080
jwt:
  secret: ${JWT_SECRET:dev-only-secret-key-please-change-32chars!}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    register-with-eureka: false
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
